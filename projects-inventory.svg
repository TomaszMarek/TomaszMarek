  <text x="58" y="31" fill="#e6edf3" font-size="12px" font-weight="bold">~/projects-inventory</text>
  <line x1="0" y1="46" x2="860" y2="46" stroke="#21262d" stroke-width="1" />

  <!-- Kolumny nagłówka -->
